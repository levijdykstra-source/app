name: Build installers

on:
  workflow_dispatch:
  push:
    branches:
      - claude/keyboard-transcription-app-0druc7
      - claude/keyboard-shortcut-transcription-app-sfpeoc

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: WhisperKey-windows
          path: release/*.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: WhisperKey-mac
          path: |
            release/*.dmg
            release/*.zip

  release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.1
          name: WhisperKey v3.0.1
          body: |
            Local, private voice-to-text: press a hotkey (or the on-screen
            Record button), speak, press again, and it transcribes offline and
            pastes at your cursor. Everything runs on your machine — no cloud,
            no account.

            **Fixed in v3.0.1**
            - Fixed `Uncaught ReferenceError: exports is not defined` that left
              the UI dead. The renderer is now bundled as plain browser code
              (no CommonJS) and talks to Electron through a secure preload
              bridge — no more reliance on Node.js running inside the page.

            **From v3.0.0**
            - **Floating recording overlay** — a draggable, always-on-top pill
              with a live waveform and timer while you dictate.
            - **Transcription history** — every dictation is saved locally;
              search, copy, delete, or export to a text file.
            - **Native notifications** for recording/transcription/errors.
            - **Output modes** — auto-paste at cursor or copy-to-clipboard only,
              with an optional trailing newline.
            - **Microphone picker + live test meter**, noise suppression and
              auto-gain toggles.
            - **Expanded model picker** (Tiny → Medium, English & multilingual)
              showing download size, RAM, and speed, plus **language selection**
              for multilingual models.
            - Redesigned **Home + Settings** tabbed interface, light/dark aware.
            - Local **debug logging** under the app's data folder.

            **Install**
            - **Windows**: download `WhisperKey Setup 3.0.1.exe` below and run
              it. Windows SmartScreen may warn about an unknown publisher (the
              app is not code-signed) — click **More info → Run anyway**.
            - **macOS (Apple Silicon)**: download the `.dmg`. Because it is not
              notarized, right-click the app → **Open** the first time.

            First transcription downloads the chosen Whisper model once, then
            runs fully offline.
          files: artifacts/**/*
