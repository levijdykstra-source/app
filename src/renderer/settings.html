<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WhisperKey Settings</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <main>
      <h1>WhisperKey</h1>
      <p class="subtitle">Local, private speech-to-text with a global hotkey.</p>

      <section>
        <label class="field-label">Recording shortcut</label>
        <button id="shortcut-btn" class="shortcut-btn" type="button">Loading…</button>
        <p class="hint">Click, then press your desired key combination. Press once to start recording, again to stop.</p>
      </section>

      <section>
        <label class="field-label" for="model-select">Whisper model</label>
        <select id="model-select"></select>
        <p class="hint">Larger models are more accurate but slower and use more memory. Models download once, on first use.</p>
      </section>

      <section class="checkbox-row">
        <input type="checkbox" id="play-sounds" />
        <label for="play-sounds">Play a sound when recording starts/stops</label>
      </section>

      <section class="checkbox-row">
        <input type="checkbox" id="launch-at-login" />
        <label for="launch-at-login">Launch WhisperKey at login</label>
      </section>

      <section>
        <label class="field-label">Status</label>
        <p id="status" class="status">Idle</p>
      </section>
    </main>
    <script src="settings.js"></script>
  </body>
</html>
